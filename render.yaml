services:
  - type: web
    name: tegabu-backend
    runtime: php
    rootDir: backend
    buildCommand: composer install --no-dev --optimize-autoloader && php artisan config:cache && php artisan route:cache
    startCommand: php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: sqlite
      - key: APP_KEY
        value: base64:DsNsklVtjQG70K6JofsD3Lu7EcLakC0Io1FToPJzcC8=
